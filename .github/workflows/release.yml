name: Linux package validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          ref: e365872a616c87ac3d235a39bbc861802ef36d72
          target: linux
      - name: Package and validate the shipped executable
        run: |
          export NSH_RUNTIME="$HOME/.nsh-dist/runtime"
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/verify-linux"
          (cd app && nsh package --target linux -o "$RUNNER_TEMP/out" --build "$GITHUB_RUN_NUMBER")
          tar -xzf "$RUNNER_TEMP/out/Noop.tar.gz" -C "$RUNNER_TEMP/verify-linux"
          TMPDIR="$RUNNER_TEMP" bash scripts/check-linux-runtime.sh "$RUNNER_TEMP/verify-linux/Noop/Noop" 2>&1 | tee "$RUNNER_TEMP/linux-runtime-validation.log"
          sha256sum "$RUNNER_TEMP/out/Noop.tar.gz" "$RUNNER_TEMP/verify-linux/Noop/Noop" > "$RUNNER_TEMP/linux-package-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-package-validation
          path: |
            ${{ runner.temp }}/out/Noop.tar.gz
            ${{ runner.temp }}/linux-runtime-validation.log
            ${{ runner.temp }}/linux-package-sha256.txt
          if-no-files-found: warn
