name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-kvm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check ARM64 KVM availability
        run: |
          uname -a
          id
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo KVM_ACCESSIBLE; else echo KVM_NOT_ACCESSIBLE; fi
          else
            echo KVM_NOT_PRESENT
          fi
