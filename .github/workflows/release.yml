name: Android simulator feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          ref: e365872a616c87ac3d235a39bbc861802ef36d72
          target: android
      - name: Package the actual Android app
        run: |
          nsh component add android
          export NSH_RUNTIME="$HOME/.nsh-dist/runtime"
          (cd app && nsh package --target android -o "$RUNNER_TEMP/android-package" --build "$GITHUB_RUN_NUMBER")
          sha256sum "$RUNNER_TEMP/android-package/Noop.apk" > "$RUNNER_TEMP/android-sha256.txt"
      - name: Install Android emulator
        run: |
          test -e /dev/kvm && sudo chmod o+rw /dev/kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name noop-test --path "$ANDROID_AVD_HOME/noop-test.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_2
          test -f "$ANDROID_AVD_HOME/noop-test.avd/config.ini"
          printf "avd.ini.encoding=UTF-8\npath=%s/noop-test.avd\ntarget=android-35\n" "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/noop-test.ini"
      - name: Launch Android app on emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd noop-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 150s adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          for i in {1..180}; do [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]] && break; sleep 2; done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          adb install "$RUNNER_TEMP/android-package/Noop.apk"
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell input keyevent KEYCODE_MENU
          adb shell monkey -p dev.noop.app 1
          sleep 12
          adb exec-out screencap -p > "$RUNNER_TEMP/android-screen.png"
          adb shell input text android@example.com
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          adb exec-out screencap -p > "$RUNNER_TEMP/android-email.png"
          adb shell uiautomator dump /sdcard/noop-window.xml >/dev/null
          adb exec-out cat /sdcard/noop-window.xml > "$RUNNER_TEMP/android-window.xml"
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' > "$RUNNER_TEMP/android-activity.log" || true
          adb logcat -d -t 1000 > "$RUNNER_TEMP/android-logcat.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-simulator-feasibility
          path: |
            ${{ runner.temp }}/android-screen.png
            ${{ runner.temp }}/android-email.png
            ${{ runner.temp }}/android-window.xml
            ${{ runner.temp }}/android-activity.log
            ${{ runner.temp }}/android-logcat.log
            ${{ runner.temp }}/android-sha256.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
