name: Noop platform probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Report native platform and service manager
        shell: bash
        run: |
          uname -a
          id
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            command -v systemctl
            command -v loginctl
            systemctl is-system-running || true
          else
            command -v launchctl
            sw_vers
          fi
