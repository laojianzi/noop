name: Noop native service and release acceptance
on:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, package: darwin-64, label: darwin-x64 }
          - { os: macos-15, package: darwin-arm64, label: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Prepare pinned runtime and Web bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/web" "$RUNNER_TEMP/evidence"
          npm pack "@cloudflare/workerd-${{ matrix.package }}@1.20261110.1" --silent --pack-destination "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime/"*.tgz -C "$RUNNER_TEMP/runtime"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/noop-web.tar.gz -o "$RUNNER_TEMP/noop-web.tar.gz"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/sha256sums -o "$RUNNER_TEMP/web-sha256sums"
          (cd "$RUNNER_TEMP" && grep '  noop-web.tar.gz$' web-sha256sums | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/noop-web.tar.gz" -C "$RUNNER_TEMP/web"
      - name: Test native service
        shell: bash
        env:
          NOOP_E2E_WEB_ASSETS: ${{ runner.temp }}/web
          NOOP_E2E_WORKERD: ${{ runner.temp }}/runtime/package/bin/workerd
          NOOP_E2E_OUT: ${{ runner.temp }}/evidence
          NOOP_E2E_DISPOSABLE: "1"
        run: test/self-hosted-macos-offline.sh
      - name: Print acceptance result
        if: always()
        shell: bash
        run: find "$RUNNER_TEMP/evidence" -name report.json -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/evidence/**/report.json
            ${{ runner.temp }}/evidence/**/install.log
            ${{ runner.temp }}/evidence/**/service-manager.log
            ${{ runner.temp }}/evidence/**/update.log
            ${{ runner.temp }}/evidence/**/SHA256SUMS
          if-no-files-found: warn
