name: Noop platform network and retention acceptance
on:
  workflow_dispatch:
jobs:
  policies:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, package: linux-64, label: linux-x64 }
          - { os: ubuntu-24.04-arm, package: linux-arm64, label: linux-arm64 }
          - { os: macos-15-intel, package: darwin-64, label: darwin-x64 }
          - { os: xcode-27, package: darwin-arm64, label: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Prepare runtime and Web bundle
        id: prepare
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/web" "$RUNNER_TEMP/evidence"
          npm pack "@cloudflare/workerd-${{ matrix.package }}@1.20261110.1" --silent --pack-destination "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime/"*.tgz -C "$RUNNER_TEMP/runtime"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/noop-web.tar.gz -o "$RUNNER_TEMP/noop-web.tar.gz"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/sha256sums -o "$RUNNER_TEMP/web-sha256sums"
          (cd "$RUNNER_TEMP" && grep '  noop-web.tar.gz$' web-sha256sums | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/noop-web.tar.gz" -C "$RUNNER_TEMP/web"
          if [[ "$(uname -s)" == Darwin ]]; then
            for ip in 127.0.0.2 127.0.0.3 127.0.0.4; do sudo ifconfig lo0 alias "$ip"; done
          fi
          printf 'NOOP_E2E_WEB_ASSETS=%s/web\nNOOP_E2E_WORKERD=%s/runtime/package/bin/workerd\nNOOP_E2E_OUT=%s/evidence\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Network and IP policy
        if: always() && steps.prepare.outcome == 'success'
        run: bun test/self-hosted-ingress-e2e.ts
      - name: Storage and usage policy
        if: always() && steps.prepare.outcome == 'success'
        run: bun test/self-hosted-budget-e2e.ts
      - name: Print acceptance results
        if: always()
        shell: bash
        run: find "$RUNNER_TEMP/evidence" -name report.json -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policies-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/evidence/**/report.json
            ${{ runner.temp }}/evidence/**/*.log
            ${{ runner.temp }}/evidence/**/SHA256SUMS
          if-no-files-found: warn
