name: Noop ARM64 native browser acceptance
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Prepare runtime, Web bundle and Playwright
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/web" "$RUNNER_TEMP/browser" "$RUNNER_TEMP/evidence"
          npm pack '@cloudflare/workerd-linux-arm64@1.20261110.1' --silent --pack-destination "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime/"*.tgz -C "$RUNNER_TEMP/runtime"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/noop-web.tar.gz -o "$RUNNER_TEMP/noop-web.tar.gz"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/sha256sums -o "$RUNNER_TEMP/web-sha256sums"
          (cd "$RUNNER_TEMP" && grep '  noop-web.tar.gz$' web-sha256sums | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/noop-web.tar.gz" -C "$RUNNER_TEMP/web"
          npm install --silent --prefix "$RUNNER_TEMP/browser" playwright-core@1.64.0
      - name: Run real ARM64 Chromium
        shell: bash
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP:/work" -v "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" -w /src debian:bookworm-slim bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq chromium ca-certificates git >/dev/null
            uname -m
            chromium --version
            export NOOP_E2E_WEB_ASSETS=/work/web NOOP_E2E_WORKERD=/work/runtime/package/bin/workerd NOOP_E2E_OUT=/work/evidence
            export NOOP_E2E_BROWSER=/usr/bin/chromium NOOP_E2E_PLAYWRIGHT=/work/browser/node_modules/playwright-core/index.js NOOP_E2E_WEB_VERSION=v0.3.18
            bun test/self-hosted-messages-e2e.ts
            chmod -R a+rX /work/evidence
          '
      - name: Print result
        if: always()
        shell: bash
        run: find "$RUNNER_TEMP/evidence" -name report.json -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-linux-arm64
          path: |
            ${{ runner.temp }}/evidence/**/report.json
            ${{ runner.temp }}/evidence/**/*.log
            ${{ runner.temp }}/evidence/**/web-messages-after-restart.png
          if-no-files-found: warn
