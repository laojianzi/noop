name: Noop native runtime acceptance
on:
  workflow_dispatch:
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, package: linux-64 }
          - { os: ubuntu-24.04-arm, package: linux-arm64 }
          - { os: macos-15-intel, package: darwin-64 }
          - { os: macos-26, package: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Prepare pinned runtime and real Web bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/web" "$RUNNER_TEMP/evidence"
          npm pack "@cloudflare/workerd-${{ matrix.package }}@1.20261110.1" --silent --pack-destination "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime/"*.tgz -C "$RUNNER_TEMP/runtime"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/noop-web.tar.gz -o "$RUNNER_TEMP/noop-web.tar.gz"
          curl -fsSL --retry 3 https://github.com/huacnlee/noop/releases/download/v0.3.18/sha256sums -o "$RUNNER_TEMP/sha256sums"
          (cd "$RUNNER_TEMP" && grep '  noop-web.tar.gz$' sha256sums | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/noop-web.tar.gz" -C "$RUNNER_TEMP/web"
      - name: Test native coordinator and recovery
        shell: bash
        env:
          NOOP_E2E_WEB_ASSETS: ${{ runner.temp }}/web
          NOOP_E2E_WEB_VERSION: v0.3.18
          NOOP_E2E_WORKERD: ${{ runner.temp }}/runtime/package/bin/workerd
          NOOP_E2E_OUT: ${{ runner.temp }}/evidence
        run: bun test/self-hosted-backup-e2e.ts
      - name: Test system service lifecycle
        if: always()
        shell: bash
        env:
          NOOP_E2E_WEB_ASSETS: ${{ runner.temp }}/web
          NOOP_E2E_WEB_VERSION: v0.3.18
          NOOP_E2E_WORKERD: ${{ runner.temp }}/runtime/package/bin/workerd
          NOOP_E2E_OUT: ${{ runner.temp }}/evidence
          NOOP_E2E_DISPOSABLE: "1"
        run: bun test/self-hosted-service-e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runtime-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/evidence/**/report.json
            ${{ runner.temp }}/evidence/**/coordinator.log
            ${{ runner.temp }}/evidence/**/service-manager.log
            ${{ runner.temp }}/evidence/**/install.log
          if-no-files-found: warn
