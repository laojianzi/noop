name: release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arm-user-mode:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: max-jit, cpu: max, jit: 'on' }
          - { mode: no-sve, cpu: 'max,sve=off', jit: 'on' }
          - { mode: no-jit, cpu: max, jit: 'off' }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: coordinator-web
          run-id: 44231492997
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/web-artifact
      - name: Prepare inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-user-static
          cd "$RUNNER_TEMP/web-artifact"
          sha256sum -c coordinator-web.sha256
          test "$(cat web-source-commit)" = 98cf0a7d5fb387acb975137d81460eb2a3d08ea8
          mkdir -p "$RUNNER_TEMP/web" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/evidence"
          tar -xzf coordinator-web.tar.gz -C "$RUNNER_TEMP/web"
          package=$(npm pack --silent --ignore-scripts '@cloudflare/workerd-linux-arm64@1.20261110.1' --pack-destination "$RUNNER_TEMP")
          tar -xzf "$RUNNER_TEMP/$package" -C "$RUNNER_TEMP/runtime"
          chmod +x "$RUNNER_TEMP/runtime/package/bin/workerd"
          docker pull debian:bookworm-slim
      - name: Compare emulated primary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --hostname noop-vm \
            -e NOOP_QEMU_CPU='${{ matrix.cpu }}' -e NOOP_DIAG_JIT='${{ matrix.jit }}' \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/web/noop:/web:ro" \
            -v "$(readlink -f "$(command -v bun)"):/usr/local/bin/bun:ro" \
            -v /usr/bin/qemu-aarch64-static:/usr/local/bin/qemu-aarch64-static:ro \
            -v "$RUNNER_TEMP/runtime/package/bin/workerd:/usr/local/bin/workerd:ro" \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -v "$RUNNER_TEMP/evidence:/evidence" \
            debian:bookworm-slim bash /src/test/arm-native-stability-diagnostic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noop-13-arm-user-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/evidence/native-arm64/*.log
            ${{ runner.temp }}/evidence/native-arm64/report.json
          if-no-files-found: warn
