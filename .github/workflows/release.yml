name: Noop service environment probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Inspect service-manager and virtual-machine capabilities
        shell: bash
        run: |
          uname -a
          id
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            loginctl show-user "$(id -un)" -p Linger || true
            systemctl --user show-environment || true
            ls -l /dev/kvm || true
            sudo -n true && echo sudo-available || true
          else
            launchctl print "gui/$(id -u)" >/dev/null && echo gui-domain-available || echo gui-domain-unavailable
            launchctl print "user/$(id -u)" >/dev/null && echo user-domain-available || echo user-domain-unavailable
            sudo -n true && echo sudo-available || true
          fi
